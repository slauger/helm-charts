name: Release Charts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-charts
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.1

      - name: Package Helm Charts
        run: |
          mkdir -p .cr-release-packages
          for chart in charts/*; do
            if [ -f "$chart/Chart.yaml" ]; then
              helm package "$chart" -d .cr-release-packages
            fi
          done

      # Ein GitHub-Release je Chart-Version, das die .tgz als Asset hostet. Idempotent:
      # existierende Releases bleiben unangetastet (kein Löschen/Neu-Anlegen der Historie).
      - name: Create GitHub Releases (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          for package in .cr-release-packages/*.tgz; do
            [ -f "$package" ] || continue
            chart_name=$(basename "$package" .tgz)
            if gh release view "$chart_name" >/dev/null 2>&1; then
              echo "• Release $chart_name existiert bereits — übersprungen"
            else
              gh release create "$chart_name" "$package" \
                --title "$chart_name" \
                --notes "Helm chart package for $chart_name" \
                --latest=false
              echo "✓ Released: $chart_name"
            fi
          done

      # Der Index wird aus den Paketen gebaut, die tatsächlich als Release-Assets liegen:
      # alle Versionen bleiben installierbar, und der Digest im Index passt zum Asset
      # (helm package ist nicht reproduzierbar, ein frisch gepacktes .tgz hat einen anderen Digest).
      - name: Download released chart packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p .cr-index
          gh release list --limit 1000 --exclude-drafts --json tagName --jq '.[].tagName' |
            while read -r tag; do
              gh release download "$tag" --pattern "$tag.tgz" --dir .cr-index \
                || echo "::warning::Release $tag has no asset $tag.tgz"
            done

      - name: Generate Helm Repository Index
        run: |
          helm repo index .cr-index --url https://github.com/slauger/helm-charts/releases/download
          # Asset-URLs auf das Tag-Verzeichnis umbiegen: /download/TAG/ASSET statt /download/ASSET
          sed -i 's|releases/download/\([^/]*\)\.tgz|releases/download/\1/\1.tgz|g' .cr-index/index.yaml

      # Nur die index.yaml auf den gh-pages-Branch (die Charts liegen als Release-Assets).
      # Force-Push: gh-pages ist ein Single-Commit-Branch mit ausschließlich der aktuellen index.yaml.
      - name: Publish index to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          work=$(mktemp -d)
          cp .cr-index/index.yaml "$work/index.yaml"
          cd "$work"
          git init -q -b gh-pages
          git add index.yaml
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update Helm repo index"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
