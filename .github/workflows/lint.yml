name: Lint Charts

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.1

      - name: Install chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
        with:
          version: 3.15.0

      # Lints every chart changed against the target branch (helm lint, yamllint,
      # Chart.yaml schema) and fails when a changed chart keeps its version, because
      # the release workflow only publishes new chart versions.
      - name: Lint changed charts
        env:
          TARGET_BRANCH: ${{ github.base_ref }}
        run: ct lint --config ct.yaml --target-branch "$TARGET_BRANCH"
