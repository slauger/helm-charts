{{- if .Values.env.googleBooksApiKeySealed }}
# Ohne Schluessel antwortet Google Books mit 429, sobald das Kontingent der geteilten
# Adresse erschoepft ist - die Suche zeigt dann "Tageskontingent erschoepft".
# Versiegeln fuer **diesen** Namespace und Secret-Namen:
#   printf '%s' "$KEY" | kubeseal --raw --namespace <ns> --name <release>-shelve-google-books \
#     --controller-name sealed-secrets --controller-namespace sealed-secrets
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "shelve.fullname" . }}-google-books
  labels:
    {{- include "shelve.labels" . | nindent 4 }}
spec:
  encryptedData:
    api-key: {{ .Values.env.googleBooksApiKeySealed | quote }}
  template:
    metadata:
      name: {{ include "shelve.fullname" . }}-google-books
    type: Opaque
{{- end }}
