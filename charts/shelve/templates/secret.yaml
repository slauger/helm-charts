# Zwei Geheimnisse, die niemand von Hand setzen soll: der Signierschluessel der Sitzungen
# und das Passwort des ersten Kontos.
#
# `pre-install` mit `hook-delete-policy: never` heisst: einmal gewuerfelt, dann nie wieder
# angefasst. Ohne den Hook wuerde Helm bei jedem Upgrade neu wuerfeln - der Schluessel
# waere ein anderer, jede offene Sitzung ungueltig, und das Passwort des Kontos stimmte
# nicht mehr mit dem ueberein, das im Secret steht.
#
# Auslesen:
#   kubectl -n <ns> get secret <release>-shelve-secrets \
#     -o jsonpath='{.data.admin-password}' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shelve.fullname" . }}-secrets
  labels:
    {{- include "shelve.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-delete-policy: never
type: Opaque
data:
  jwt-secret: {{ randAlphaNum 48 | b64enc | quote }}
  admin-password: {{ randAlphaNum 20 | b64enc | quote }}
