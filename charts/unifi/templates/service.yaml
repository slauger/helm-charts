{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "unifi.fullname" . }}
  labels:
    {{- include "unifi.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "unifi.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: 8443
      targetPort: https
    - name: inform
      port: 8080
      targetPort: inform
    - name: stun
      port: 3478
      targetPort: stun
      protocol: UDP
{{- end }}
