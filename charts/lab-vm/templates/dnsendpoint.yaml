{{- if .Values.dns.enabled }}
{{- if or (not .Values.dns.hostname) (not .Values.lan.address) }}
{{- fail "dns.hostname and a static lan.address are required when dns.enabled=true" }}
{{- end }}
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: {{ include "lab-vm.fullname" . }}
  labels:
    {{- include "lab-vm.labels" . | nindent 4 }}
spec:
  endpoints:
    - dnsName: {{ .Values.dns.hostname }}
      recordType: A
      recordTTL: {{ .Values.dns.ttl }}
      targets:
        - {{ include "lab-vm.lanIP" . }}
{{- end }}
