{{- if and .Values.mailpit.enabled .Values.mailpit.ingress.enabled }}
{{- if not .Values.mailpit.uiAuthSealed }}
{{- fail "mailpit.uiAuthSealed is required when mailpit.ingress.enabled is true - an unauthenticated mailbox must not be public" }}
{{- end }}
# Zugangsdaten fuer Mailpits Weboberflaeche, sobald sie oeffentlich erreichbar ist.
#
# **Der Riegel haengt am Ingress, nicht am Gefallen.** Ohne Auth zeigt Mailpit jede abgefangene
# Mail im Klartext - Gastnamen, Adressen, Belege. Deshalb ist der Wert Pflicht, sobald der
# Ingress an ist: ``fail`` oben statt eines stillen Defaults.
#
# Versiegelt wie das Render-Token; Begruendung in render-secret.yaml.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "eibtalio.fullname" . }}-mailpit
  labels:
    {{- include "eibtalio.labels" . | nindent 4 }}
    app.kubernetes.io/component: mailpit
spec:
  encryptedData:
    ui-auth: {{ .Values.mailpit.uiAuthSealed | quote }}
  template:
    metadata:
      name: {{ include "eibtalio.fullname" . }}-mailpit
      labels:
        {{- include "eibtalio.labels" . | nindent 8 }}
        app.kubernetes.io/component: mailpit
    type: Opaque
{{- end }}
