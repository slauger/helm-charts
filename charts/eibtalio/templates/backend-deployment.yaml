{{- if not .Values.backend.image }}
{{- fail "backend.image is required" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eibtalio.fullname" . }}-backend
  labels:
    {{- include "eibtalio.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "eibtalio.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      {{- if .Values.render.enabled }}
      annotations:
        # Siehe render-deployment.yaml: beide Seiten teilen das Token, beide muessen zusammen
        # rollen, wenn es sich aendert.
        checksum/render-token: {{ .Values.render.tokenSealed | sha256sum }}
      {{- end }}
      labels:
        {{- include "eibtalio.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          env:
            - name: EIBTALIO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "eibtalio.fullname" . }}-db-app
                  key: uri
            - name: EIBTALIO_JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "eibtalio.fullname" . }}-secrets
                  key: jwt-secret-key
            - name: EIBTALIO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "eibtalio.fullname" . }}-secrets
                  key: admin-password
            - name: EIBTALIO_DEBUG
              value: {{ .Values.env.debug | quote }}
            {{- if .Values.env.corsOrigins }}
            - name: EIBTALIO_CORS_ORIGINS
              value: {{ .Values.env.corsOrigins | quote }}
            {{- end }}
            {{- if .Values.mailpit.enabled }}
            # Der Vorgabewert im Code ist `mailpit` - der Compose-Dienstname. Im Cluster heisst
            # der Dienst `<release>-mailpit`, dort stimmt die Vorgabe also nie. Ohne diese Zeile
            # traegt der Seed einen Host ein, den es nicht gibt, und niemand merkt es: Der
            # Versand scheitert still, ohne Fehler in der Oberflaeche.
            - name: EIBTALIO_MAIL_DEV_HOST
              value: {{ include "eibtalio.fullname" . }}-mailpit
            - name: EIBTALIO_MAIL_DEV_PORT
              value: "1025"
            {{- end }}
            {{- if .Values.render.enabled }}
            # Der Renderer ist die letzte Stufe, nicht die Voraussetzung: Ohne ihn entstehen
            # Belege weiterhin, nur eben kein PDF. Fehlt die Adresse, antwortet jeder
            # PDF-Abruf mit "Beleg wurde abgelehnt" - einer Meldung, die zur Korrektur der
            # Empfaengerdaten raet, waehrend in Wahrheit nur der Dienst fehlt.
            - name: EIBTALIO_RENDER_URL
              value: http://{{ include "eibtalio.fullname" . }}-render:{{ .Values.render.port }}
            - name: EIBTALIO_RENDER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "eibtalio.fullname" . }}-render
                  key: token
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
