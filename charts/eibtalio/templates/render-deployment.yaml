{{- if .Values.render.enabled }}
{{- if not .Values.render.image }}
{{- fail "render.image is required when render.enabled is true" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eibtalio.fullname" . }}-render
  labels:
    {{- include "eibtalio.labels" . | nindent 4 }}
    app.kubernetes.io/component: render
spec:
  replicas: {{ .Values.render.replicas }}
  selector:
    matchLabels:
      {{- include "eibtalio.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: render
  template:
    metadata:
      annotations:
        # Aendert sich das Token, rollen **beide** Pods - Backend und Renderer teilen es sich,
        # und ``secretKeyRef`` wird nur beim Start gelesen. Ohne diese Zeile rollte bei einer
        # Rotation nur die Seite, deren Deployment sich sonst noch aenderte; die andere behielte
        # das alte Token und jeder PDF-Abruf endete in 401.
        checksum/render-token: {{ .Values.render.tokenSealed | sha256sum }}
      labels:
        {{- include "eibtalio.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: render
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: render
          image: {{ .Values.render.image }}
          ports:
            - name: http
              containerPort: {{ .Values.render.port }}
          env:
            # Ohne Token startet der Dienst nicht - ein offener Renderer nimmt Auftraege von
            # jedem an. Dasselbe Secret liest das Backend, damit beide Seiten nicht auseinander
            # laufen koennen.
            - name: FAKTURIO_RENDER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "eibtalio.fullname" . }}-render
                  key: token
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.render.resources | nindent 12 }}
{{- end }}
