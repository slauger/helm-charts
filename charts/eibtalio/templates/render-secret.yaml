{{- if .Values.render.enabled }}
{{- $name := printf "%s-render" (include "eibtalio.fullname" .) }}
{{- $vorhanden := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "eibtalio.labels" . | nindent 4 }}
    app.kubernetes.io/component: render
type: Opaque
data:
  # **Bewusst kein pre-install-Hook** wie bei ``secret.yaml``. Der Hook laeuft nur bei der
  # Installation; ein bestehendes Release bekaeme das Token nie, und beide Pods blieben mit
  # "key not found" stehen. Stattdessen einmal wuerfeln und danach den vorhandenen Wert
  # weiterreichen - so entsteht es auch beim Upgrade und aendert sich danach nicht mehr.
  # (``lookup`` liefert bei ``helm template``/Dry-Run nichts; dann wird gewuerfelt, was fuer
  # eine reine Ausgabe ohne Cluster richtig ist.)
  token: {{ if $vorhanden }}{{ index $vorhanden.data "token" }}{{ else }}{{ randAlphaNum 32 | b64enc | quote }}{{ end }}
{{- end }}
