{{- if .Values.render.enabled }}
{{- if not .Values.render.tokenSealed }}
{{- fail "render.tokenSealed is required when render.enabled is true (kubeseal --raw blob)" }}
{{- end }}
# Das Render-Token als SealedSecret, nicht im Chart gewuerfelt.
#
# **Warum nicht ``randAlphaNum``:** ArgoCD rendert mit ``helm template`` ohne Cluster-Zugriff,
# also liefert ``lookup`` nichts und jeder Reconcile wuerfelt neu. Das Release waere dauerhaft
# OutOfSync, selfHeal schriebe jedes Mal ein neues Token - und weil ``secretKeyRef`` nur beim
# Pod-Start gelesen wird, behielten die Pods das alte. Ergebnis: 401 bei jedem PDF.
#
# Der verschluesselte Blob steht dagegen in den Values, ist also stabil und diffbar. Er ist an
# Namespace **und** Secret-Namen gebunden (kubeseal-Standardbereich): Umbenennen des Release
# heisst neu versiegeln.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "eibtalio.fullname" . }}-render
  labels:
    {{- include "eibtalio.labels" . | nindent 4 }}
    app.kubernetes.io/component: render
spec:
  encryptedData:
    token: {{ .Values.render.tokenSealed | quote }}
  template:
    metadata:
      name: {{ include "eibtalio.fullname" . }}-render
      labels:
        {{- include "eibtalio.labels" . | nindent 8 }}
        app.kubernetes.io/component: render
    type: Opaque
{{- end }}
