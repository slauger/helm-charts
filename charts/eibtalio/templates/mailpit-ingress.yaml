{{- if and .Values.mailpit.enabled .Values.mailpit.ingress.enabled }}
{{- if not .Values.mailpit.ingress.host }}
{{- fail "mailpit.ingress.host is required when mailpit.ingress.enabled is true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "eibtalio.fullname" . }}-mailpit
  labels:
    {{- include "eibtalio.labels" . | nindent 4 }}
    app.kubernetes.io/component: mailpit
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.mailpit.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.mailpit.ingress.host }}
      secretName: {{ .Values.mailpit.ingress.tls.secretName | default (printf "%s-mailpit-tls" (include "eibtalio.fullname" .)) }}
  {{- end }}
  rules:
    - host: {{ .Values.mailpit.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "eibtalio.fullname" . }}-mailpit
                port:
                  name: http
{{- end }}
