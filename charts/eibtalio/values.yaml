---
imagePullSecrets: []

backend:
  # Required — no defaults, must be set
  image: ""
  replicas: 1
  port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  # Required — no defaults, must be set
  image: ""
  replicas: 1
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Der Beleg-Renderer (Container `eibtalio-render`). Das eigene Beleg-Backend fakturio erzeugt
# die Belege selbst, aber nicht das PDF — dafür braucht es diesen Dienst. Er hält keine Daten
# und bedient jedes Haus, deshalb genügt eine Instanz. Ist er aus, bleiben Belege und
# Buchhaltung nutzbar; nur der PDF-Abruf scheitert.
render:
  enabled: false
  # Required when enabled — no defaults, must be set
  image: ""
  # Das geteilte Token zwischen Backend und Renderer, versiegelt für **diesen** Namespace und
  # den Secret-Namen `<release>-render`:
  #   printf '%s' "$TOKEN" | kubeseal --raw --namespace <ns> --name <release>-render \
  #     --controller-name sealed-secrets --controller-namespace sealed-secrets
  # Bewusst nicht im Chart gewürfelt — Begründung in templates/render-secret.yaml.
  tokenSealed: ""
  replicas: 1
  port: 8000
  resources:
    requests:
      cpu: 100m
      # WeasyPrint zeichnet über Pango; das Layout einer Seite braucht kurz spürbar Speicher.
      memory: 192Mi
    limits:
      cpu: 1000m
      memory: 768Mi

# Mailpit fängt in QA/Demo den ausgehenden Mailverkehr ab — nur dort einschalten. Ohne ihn
# bleibt die Wahl zwischen "kein Mailversand" und echtem SMTP, und echtes SMTP an einer
# Umgebung mit erfundenen Gästen schickt Post an erfundene Empfänger.
# Nur clusterintern erreichbar; zum Hineinsehen `kubectl port-forward svc/<release>-mailpit 8025`.
# **Der Host allein genügt nicht**: Die Mail-Einstellungen liegen in der Datenbank, nicht in der
# Umgebung — sie zeigen erst nach einer Konfiguration in der Oberfläche hierher.
mailpit:
  enabled: false
  image: axllent/mailpit:latest
  # POP3-Zugang für die Posteingangs-Tests; dieselben Zugangsdaten wie lokal.
  pop3Auth: "dev:dev"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

ingress:
  enabled: false
  className: ""
  frontendHost: ""
  backendHost: ""
  tls:
    enabled: false
    frontendSecretName: ""
    backendSecretName: ""

postgresql:
  instances: 1
  storage:
    size: 5Gi

# Nächtlicher Testdaten-Reset (nur für QA/Demo-Umgebungen aktivieren!)
testdataReset:
  enabled: false
  schedule: "0 2 * * *"
  timeZone: "Europe/Berlin"

env:
  debug: "false"
  corsOrigins: ""
