{{- if .Values.influxdb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "iobroker.fullname" . }}-influxdb
  labels:
    {{- include "iobroker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "iobroker.influxdb.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8086
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "iobroker.fullname" . }}-influxdb
  labels:
    {{- include "iobroker.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "iobroker.fullname" . }}-influxdb
  selector:
    matchLabels:
      {{- include "iobroker.influxdb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "iobroker.influxdb.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: influxdb
          image: {{ .Values.influxdb.image.repository }}:{{ .Values.influxdb.image.tag }}
          imagePullPolicy: {{ .Values.influxdb.image.pullPolicy }}
          env:
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: INFLUXDB_REPORTING_DISABLED
              value: "true"
            {{- with .Values.influxdb.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8086
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
            failureThreshold: 5
          resources:
            {{- toYaml .Values.influxdb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/influxdb
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.influxdb.persistence.accessModes | nindent 10 }}
        {{- with .Values.influxdb.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.influxdb.persistence.size }}
{{- end }}
