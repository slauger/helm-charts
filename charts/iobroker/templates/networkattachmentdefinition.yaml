{{- if and .Values.lan.enabled .Values.lan.createNetworkAttachment }}
{{- if or (not .Values.lan.subnet) (not .Values.lan.address) }}
{{- fail "lan.subnet and lan.address are required when lan.enabled=true" }}
{{- end }}
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ include "iobroker.networkName" . }}
  labels:
    {{- include "iobroker.labels" . | nindent 4 }}
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": {{ include "iobroker.networkName" . | quote }},
      "type": "bridge",
      "bridge": {{ .Values.lan.bridge | quote }},
      "capabilities": { "mac": true },
      "ipam": {
        "type": "host-local",
        "ranges": [[{
          "subnet": {{ .Values.lan.subnet | quote }},
          "rangeStart": {{ .Values.lan.address | quote }},
          "rangeEnd": {{ .Values.lan.address | quote }}
        }]]
      }
    }
{{- end }}
