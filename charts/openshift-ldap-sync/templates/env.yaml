kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-ldap-env
data:
  IDP_NAME: {{ required "oauth.identityProvider is required" .Values.oauth.identityProvider | quote }}
  OAUTH_NAME: {{ required "oauth.name is required" .Values.oauth.name | quote }}
  CONFIG_NAMESPACE: {{ required "oauth.configNamespace is required" .Values.oauth.configNamespace | quote }}
  SYNC_MODE: {{ required "mode is required" .Values.mode | quote }}
  BIND_DN: {{ .Values.params.bindDN | quote }}
  GROUPS_BASE_DN: {{ .Values.params.groupsBaseDN | quote }}
  USERS_BASE_DN: {{ .Values.params.usersBaseDN | quote }}
  LDAP_SCOPE: {{ .Values.ldap.scope | quote }}
  GROUP_UID_ATTRIBUTE: {{ .Values.ldap.groupUIDAttribute | quote }}
  GROUP_NAME_ATTRIBUTES: {{ .Values.ldap.groupNameAttributes | quote }}
  GROUP_MEMBERSHIP_ATTRIBUTES: {{ .Values.ldap.groupMembershipAttributes | quote }}
  GROUPS_FILTER: {{ .Values.ldap.groupsFilter | quote }}
  USER_NAME_ATTRIBUTES: {{ .Values.ldap.userNameAttributes | quote }}
  USERS_FILTER: {{ .Values.ldap.usersFilter | quote }}
  PAGE_SIZE: {{ .Values.ldap.pageSize | quote }}
{{- if .Values.params.bindPassword }}
  BIND_PASSWORD_FILE: "/etc/secrets/bindPassword"
{{- end }}
{{- if .Values.cabundle }}
  CA_FILE: "/etc/ldap-ca/ca.crt"
{{- end }}
