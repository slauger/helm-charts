{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-ldap-group-sync
  namespace: {{ .Values.oauth.configNamespace }}
rules:
  - apiGroups:
      - ''
    resources:
      - secrets
      - configmaps
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-ldap-group-sync
  namespace: {{ .Values.oauth.configNamespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "openshift-ldap-sync.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-ldap-group-sync
{{- end }}
